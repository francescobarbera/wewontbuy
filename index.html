    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "We Won't Buy",
        "url": "https://wewontbuy.com/",
        "description": "Feel the urge to shop? Browse a fake fashion shop, fill your cart and check out for free. A private tool for no-buy challenges and impulse shopping.",

        "browserRequirements": "Requires JavaScript",
        "inLanguage": ["en", "it", "de", "es", "fr"],

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What is We Won't Buy?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "A fake fashion shop for real shopping urges. You can browse, add items to your cart and complete checkout, but every product is fictional and the real charge is always 0."
            }
          },
          {
            "@type": "Question",
            "name": "Can I actually buy anything here?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. Nothing is for sale and nothing ships. At the end you get a receipt for the money you didn't spend."
            }
          },
          {
            "@type": "Question",
            "name": "How can it help with impulse shopping?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sometimes the urge is about the ritual: browsing, choosing, adding to cart, closing the loop. We Won't Buy lets that ritual finish without a real order. You can also park an item on the Cooling-Off Rack for 24 hours and see whether you still want it."
            }
          },
          {
            "@type": "Question",
            "name": "Can I use it for a no-buy challenge?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Use it when the urge hits during a no-buy month or year. Your saved dashboard keeps track of money not spent and items left imaginary."
            }
          },
          {
            "@type": "Question",
            "name": "Is my data private?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "There's no account, no cookies and no backend. Your cart, receipts and totals stay in your browser, and clearing site data removes them."
            }
          },
          {
            "@type": "Question",
            "name": "Where do the products come from?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Every garment and product image is fictional and AI-generated. They're designed to look tempting without becoming one more thing to own."
            }
          },
          {
            "@type": "Question",
            "name": "Is this anti-fashion?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. It isn't about shaming fashion. It's for the moments when the shopping ritual itself is the urge."
            }
          },
          {
            "@type": "Question",
            "name": "Is this a treatment for shopping addiction?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. It's a small harm-reduction tool, not therapy. If shopping feels out of control, talking to a professional can really help."
            }
          }
        ]
      }
    </script>
